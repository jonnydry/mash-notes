version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
    ignore:
      # Kit 3.1.1 and svelte-check 4.7.8 only accept TypeScript 6.
      # A grouped major bump fails npm ci with ERESOLVE.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: America/New_York
    open-pull-requests-limit: 3
